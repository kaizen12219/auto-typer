<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auto Typer</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header>
        <h1>Auto Typer</h1>
        <p id="status-text">Enabled</p>
      </header>

      <label class="switch-row" for="enabled-toggle">
        <span>Enable typing</span>
        <input id="enabled-toggle" type="checkbox" role="switch">
      </label>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
